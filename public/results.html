<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>נצור לשונך – תוצאות</title><link rel="stylesheet" href="/styles.css"></head><body class="results-page"><header class="results-hero"><div class="results-logo">נצור לשונך</div><div class="results-slogan">בוחרים לדבר נקי</div></header><main class="results-wrap"><div id="publicLeader" class="public-leader">טוען תוצאות…</div><div class="panel"><h2>🏆 20 התלמידים המובילים</h2><div id="publicStudents"></div><div class="small" style="margin-top:10px">הנתונים מתעדכנים אוטומטית.</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rank(n){n=Number(n);if(n>=150)return'🏆 אלוף נצור לשונך';if(n>=120)return'⭐ מוביל שפה נקייה';if(n>=90)return'🛡️ מגן הדיבור';if(n>=60)return'💬 נאמן הלשון';if(n>=30)return'🌱 שומר המילה';if(n<=-100)return'🛑 דורש שינוי';if(n<=-80)return'🚦 עצירה וחשיבה';if(n<=-60)return'🧭 חוזר למסלול';if(n<=-40)return'🔄 מתחזק בדיבור';if(n<=-20)return'⚠️ בדרך לתיקון';return''}async function refresh(){try{const r=await fetch('/api/public/results',{cache:'no-store'}),d=await r.json();const g=d.leader;document.getElementById('publicLeader').innerHTML=g?`<div>🏆 קבוצת הלימודים המובילה</div><div class="name">${esc(g.name)}</div><div class="points">${g.score} נקודות</div>`:'עדיין אין נתונים';document.getElementById('publicStudents').innerHTML=d.students.map((s,i)=>`<div class="public-row ${i<3?'top':''}"><div class="public-place">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div><div class="public-name">${esc(s.name)}</div><div class="public-class">${esc(s.class_name)} ${rank(s.score)?'· '+rank(s.score):''}</div></div><div class="public-score">${s.score}</div></div>`).join('')}catch(e){document.getElementById('publicStudents').textContent='לא ניתן לטעון כרגע'}}refresh();setInterval(refresh,10000)</script></body></html>
